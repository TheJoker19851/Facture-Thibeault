mutation DeleteCreditCardAndHolder(
  $cardId: String!
  $holderId: String!
  $auditEventId: String!
  $auditDetails: String!
) @auth(expr: "auth.token.role == 'ADMIN'") @transaction {
  query @redact @check(
    expr: "response.query.card.size() == 1 && response.query.holderCards.size() == 1 && response.query.cardStatements.size() == 0 && response.query.cardHolderHistory.size() == 0 && response.query.cardTransactions.size() == 0 && response.query.holderStatements.size() == 0 && response.query.holderHistory.size() == 0 && response.query.holderCorrections.size() == 0 && response.query.holderInvoices.size() == 0"
    message: "Cette carte ou ce titulaire possède un historique ou une autre association et ne peut pas être supprimé. Désactivez la carte plutôt."
  ) {
    card: creditCards(where: { id: { eq: $cardId }, holder: { id: { eq: $holderId } } }, limit: 1) { id }
    holderCards: creditCards(where: { holder: { id: { eq: $holderId } } }, limit: 2) { id }
    cardStatements: creditCardStatements(where: { card: { id: { eq: $cardId } } }, limit: 1) { id }
    cardHolderHistory: creditCardHolderHistories(where: { card: { id: { eq: $cardId } } }, limit: 1) { id }
    cardTransactions: expenseTransactions(where: { card: { id: { eq: $cardId } } }, limit: 1) { id }
    holderStatements: creditCardStatements(where: { holderIdSnapshot: { eq: $holderId } }, limit: 1) { id }

# Server-side compare-and-set claim. A retry or a second browser request can
# observe the queued intake, but only one processor may move it to RUNNING.
mutation ClaimInvoiceIntakeProcessing(
  $receiptId: String!
  $processingAttempts: Int!
  $maxAttempts: Int! = 5
  $actorUid: String = ""
  $actorRole: String = ""
  $writeAudit: Boolean = false
  $auditEventId: String = ""
  $auditDetails: String = "{}"
) @auth(level: NO_ACCESS) @transaction {
  invoiceIntake_updateMany(
    where: {
      receiptId: { eq: $receiptId }
      processingStatus: { eq: "PROCESSING" }
      processingState: { in: ["QUEUED", "RETRY"] }
      accountingStatus: { eq: "NOT_POSTED" }
    }
    data: {
      processingState: "RUNNING"
      processingAttempts: $processingAttempts
      lastAttemptAt_expr: "request.time"
      lastError: null
    }
  )
  query @redact @check(expr: "response.invoiceIntake_updateMany == 1 && vars.processingAttempts <= vars.maxAttempts", message: "L’intake a atteint le nombre maximal de tentatives ou est déjà pris en charge.") {
    invoiceIntakes(where: { receiptId: { eq: $receiptId } }) { receiptId }
  }
  auditEvent_upsert(data: {
    id: $auditEventId
    actorUid: $actorUid
    actorRole: $actorRole
    action: "AI_PROCESSING_STARTED"
    entityType: "InvoiceIntake"
    entityId: $receiptId
    details: $auditDetails
  }) @include(if: $writeAudit)
}

# A Vercel timeout can leave a claimed intake in RUNNING after the function is
# gone. Only a server-side worker may reopen it, and only after the lease has
# expired; the timestamp predicate prevents a newer attempt from being reset.
mutation RequeueStaleInvoiceIntake(
  $receiptId: String!
  $staleBefore: Timestamp!
  $maxAttempts: Int!
  $actorUid: String!
  $actorRole: String!
  $auditEventId: String!
  $auditDetails: String!
) @auth(level: NO_ACCESS) @transaction {
  invoiceIntake_updateMany(
    where: {
      receiptId: { eq: $receiptId }
      processingStatus: { eq: "PROCESSING" }
      processingState: { eq: "RUNNING" }
      processingAttempts: { lt: $maxAttempts }
      accountingStatus: { eq: "NOT_POSTED" }
      lastAttemptAt: { lt: $staleBefore }
    }
    data: {
      processingState: "RETRY"
      lastError: "Le traitement automatique précédent a dépassé son délai; une nouvelle tentative est planifiée."
    }
  )
  query @redact @check(expr: "response.invoiceIntake_updateMany == 1", message: "L’intake n’est plus un traitement RUNNING expiré.") {
    invoiceIntakes(where: { receiptId: { eq: $receiptId } }) { receiptId }
  }
  auditEvent_upsert(data: {
    id: $auditEventId
    actorUid: $actorUid
    actorRole: $actorRole
    action: "AI_PROCESSING_FAILED"
    entityType: "InvoiceIntake"
    entityId: $receiptId
    details: $auditDetails
  })
}


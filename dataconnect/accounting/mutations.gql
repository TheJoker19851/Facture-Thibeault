# Current match state is one row per statement line. SQL unique constraints on
# statementLine, expenseTransaction and invoice reject double-jumelages even
# when two server requests race.
mutation PersistReconciliationMatch(
  $id: String!
  $statementLineId: String!
  $expenseTransactionId: String!
  $invoiceId: String!
  $matchScore: Float
  $matchMethod: String!
  $status: String!
  $confirmedById: String!
  $confirmedAt: Timestamp
  $reason: String
  $details: String
  $lineStatus: String!
  $transactionReconciliationStatus: String!
  $auditEventId: String!
  $actorUid: String!
  $actorRole: String!
  $auditAction: String!
  $auditDetails: String!
  $expectedMatchId: String
  $expectedExpenseTransactionId: String
) @auth(level: NO_ACCESS) @transaction {
  query @redact @check(expr: "(vars.expectedMatchId == null && response.query.reconciliationMatches.size() == 0) || (vars.expectedMatchId != null && response.query.reconciliationMatches.size() == 1 && response.query.reconciliationMatches[0].id == vars.expectedMatchId && response.query.reconciliationMatches[0].expenseTransaction.id == vars.expectedExpenseTransactionId)", message: "Le jumelage a déjà été modifié par une autre action. Actualisez le rapprochement.") {
    reconciliationMatches(where: { statementLine: { id: { eq: $statementLineId } } }, limit: 1) { id expenseTransaction { id } }
  }
  reconciliationMatch_upsert(data: {
    id: $id
    statementLine: { id: $statementLineId }
    expenseTransaction: { id: $expenseTransactionId }
    invoice: { id: $invoiceId }
    matchScore: $matchScore
    matchMethod: $matchMethod
    status: $status
    confirmedBy: { id: $confirmedById }
    confirmedAt: $confirmedAt
    reason: $reason
    details: $details
  })
  creditCardStatementLine_update(key: { id: $statementLineId }, data: { status: $lineStatus })
  expenseTransaction_update(key: { id: $expenseTransactionId }, data: { reconciliationStatus: $transactionReconciliationStatus })
  auditEvent_upsert(data: {
    id: $auditEventId
    actorUid: $actorUid
    actorRole: $actorRole
    action: $auditAction
    entityType: "CreditCardStatementLine"
    entityId: $statementLineId
    details: $auditDetails
  })
}

mutation ClearReconciliationMatch(
  $id: String!
  $statementLineId: String!
  $previousExpenseTransactionId: String!
  $lineStatus: String!
  $auditEventId: String!
  $actorUid: String!
  $actorRole: String!
  $auditAction: String!
  $auditDetails: String!
) @auth(level: NO_ACCESS) @transaction {
  query @redact @check(expr: "response.query.reconciliationMatches.size() == 1 && response.query.reconciliationMatches[0].id == vars.id && response.query.reconciliationMatches[0].expenseTransaction.id == vars.previousExpenseTransactionId", message: "Le jumelage a déjà été dissocié ou modifié.") {
    reconciliationMatches(where: { id: { eq: $id } }, limit: 1) { id expenseTransaction { id } }
  }
  reconciliationMatch_update(key: { id: $id }, data: {
    expenseTransaction: null
    invoice: null
    status: "UNLINKED"
    confirmedBy: null
    confirmedAt: null
  })
  creditCardStatementLine_update(key: { id: $statementLineId }, data: { status: $lineStatus })
  expenseTransaction_update(key: { id: $previousExpenseTransactionId }, data: { reconciliationStatus: "UNMATCHED" })
  auditEvent_upsert(data: {
    id: $auditEventId
    actorUid: $actorUid
    actorRole: $actorRole
    action: $auditAction
    entityType: "CreditCardStatementLine"
    entityId: $statementLineId
    details: $auditDetails
  })
}


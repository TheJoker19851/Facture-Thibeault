  $sku: String
  $category: String!
  $accountCode: String!
  $cardId: String!
  $statementPeriodId: String!
  $projectId: String!
  $storageFolder: String!
  $classificationNote: String!
) @auth(expr: "auth.token.role == 'KIM' || auth.token.role == 'ADMIN'") @transaction {
  invoiceIntake_updateMany(
    where: {
      receiptId: { eq: $receiptId }
      processingStatus: { eq: "VALIDATED" }
      accountingStatus: { eq: "NOT_POSTED" }
    }
    data: { accountingStatus: "POSTED" }
  )
  query @redact @check(expr: "false", message: "Ce commit V1 est désactivé; actualisez l’application.") {
    invoiceIntakes(where: { receiptId: { eq: $receiptId } }) { receiptId }
  }
  expenseTransaction_upsert(data: {
    id: $transactionId
    transactionDate: $invoiceDate
    vendor: $vendor
    card: { id: $cardId }
    statementPeriod: { id: $statementPeriodId }
    project: { id: $projectId }
    expenseAccount: { code: $accountCode }
    categoryLabel: $category
    sku: $sku
    amountBeforeTaxCents: $subtotalCents
    tpsCents: $tpsCents
    tvqCents: $tvqCents
    totalCents: $totalCents
    currency: $currency
    status: "VALIDATED"
    processingStatus: "VALIDATED"
    accountingStatus: "POSTED"
    reconciliationStatus: "UNMATCHED"
    classificationSource: "KIM_COMMIT"
    classificationConfidence: 1.0
    classificationNote: $classificationNote
    invoiceNumber: $invoiceNumber
    issue: null
  })
  invoice_upsert(data: {
    id: $invoiceId
    transaction: { id: $transactionId }
    vendor: $vendor
    invoiceNumber: $invoiceNumber
    invoiceDate: $invoiceDate
    subtotalCents: $subtotalCents
    tpsCents: $tpsCents
    tvqCents: $tvqCents
    totalCents: $totalCents
    processingStatus: "VALIDATED"
    accountingStatus: "POSTED"
    reviewStatus: "VALIDATED"
    storageFolder: $storageFolder
  })
  invoiceIntake_update(
    key: { receiptId: $receiptId }
    data: {
      status: "VALIDATED"
      processingStatus: "VALIDATED"
      accountingStatus: "POSTED"
      lastError: null
      classificationSource: "KIM_COMMIT"
      classificationStatus: "COMMITTED"
      classificationConfidence: 1.0
    }
  )
}

mutation CommitInvoiceIntakeWithoutProject(
  $receiptId: String!
  $transactionId: String!
  $invoiceId: String!
  $vendor: String!
  $invoiceNumber: String
  $invoiceDate: Date!
  $subtotalCents: Int64!
  $tpsCents: Int64!
  $tvqCents: Int64!
  $totalCents: Int64!
  $currency: String!
  $sku: String
  $category: String!
  $accountCode: String!
  $cardId: String!
  $statementPeriodId: String!
  $storageFolder: String!

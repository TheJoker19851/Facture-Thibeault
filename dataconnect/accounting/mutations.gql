# The mobile app can acknowledge an authenticated Storage upload. This creates
# only a processing intake record; privileged server processing will later
# create Invoice/InvoicePhoto/ExpenseTransaction rows after OCR and review.

mutation UpsertUserProfile(
  $id: String!
  $firebaseUid: String
  $displayName: String!
  $email: String
  $jobTitle: String
  $role: String!
  $status: String!
) @auth(expr: "auth.token.role == 'ADMIN'") {
  userProfile_upsert(data: {
    id: $id
    firebaseUid: $firebaseUid
    displayName: $displayName
    email: $email
    jobTitle: $jobTitle
    role: $role
    status: $status
  })
}

mutation UpsertCreditCard(
  $id: String!
  $lastFour: String!
  $holderId: String!
  $cardFunction: String
  $status: String!
  $activeFrom: Date
  $inactiveFrom: Date
) @auth(expr: "auth.token.role == 'KIM' || auth.token.role == 'ADMIN'") @transaction {
  query @redact @check(
    expr: "response.query.creditCards.size() == 0"
    message: "Une carte active portant ces quatre chiffres est déjà associée à ce titulaire."
  ) {
    creditCards(where: {
      id: { ne: $id }
      lastFour: { eq: $lastFour }
      holder: { id: { eq: $holderId } }
      status: { eq: "ACTIVE" }
    }, limit: 1) { id }
  }
  creditCard_upsert(data: {
    id: $id
    lastFour: $lastFour
    holder: { id: $holderId }
    cardFunction: $cardFunction
    status: $status
    activeFrom: $activeFrom
    inactiveFrom: $inactiveFrom
  })
}

# User access operations are server-only. The API authenticates the ADMIN
# caller with Firebase Admin before invoking these NO_ACCESS mutations.
mutation AdminUpsertUserProfileWithAudit(
  $id: String!
  $firebaseUid: String
  $displayName: String!
  $email: String
  $jobTitle: String
  $role: String!
  $status: String!
  $invitationStatus: String!
  $invitationSentAt: Timestamp
  $invitationSentBy: String
  $lastInvitationError: String
  $activatedAt: Timestamp
  $auditEventId: String!
  $actorUid: String!
  $actorRole: String!
  $auditAction: String!
  $auditDetails: String!
  $deactivateCards: Boolean! = false
  $inactiveFrom: Date
) @auth(level: NO_ACCESS) @transaction {
  userProfile_upsert(data: {
    id: $id
    firebaseUid: $firebaseUid
    displayName: $displayName
    email: $email
    jobTitle: $jobTitle
    role: $role
    status: $status
    invitationStatus: $invitationStatus
    invitationSentAt: $invitationSentAt
    invitationSentBy: $invitationSentBy
    lastInvitationError: $lastInvitationError
    activatedAt: $activatedAt
  })
  creditCard_updateMany(
    where: {
      holder: { id: { eq: $id } }
      status: { eq: "ACTIVE" }
    }
    data: {
      status: "INACTIVE"
      inactiveFrom: $inactiveFrom
    }
  ) @include(if: $deactivateCards)
  auditEvent_upsert(data: {
    id: $auditEventId
    actorUid: $actorUid
    actorRole: $actorRole
    action: $auditAction
    entityType: "UserProfile"
    entityId: $id
    details: $auditDetails
  })
}

mutation AdminRecordUserAudit(
  $auditEventId: String!
  $actorUid: String!
  $actorRole: String!
  $auditAction: String!
  $entityId: String!
  $auditDetails: String!
) @auth(level: NO_ACCESS) {
  auditEvent_upsert(data: {
    id: $auditEventId
    actorUid: $actorUid
    actorRole: $actorRole
    action: $auditAction
    entityType: "UserProfile"
    entityId: $entityId
    details: $auditDetails
  })
}

mutation DeleteUserProfile(
  $id: String!
  $firebaseUid: String!
  $auditEventId: String!
  $auditDetails: String!
) @auth(expr: "auth.token.role == 'ADMIN'") @transaction {
  query @redact @check(
    expr: "response.query.profile.size() == 1 && response.query.adminProfile.size() == 0 && response.query.cards.size() == 0 && response.query.cardStatements.size() == 0 && response.query.importedStatements.size() == 0 && response.query.cardHolderHistory.size() == 0 && response.query.corrections.size() == 0 && response.query.invoices.size() == 0 && response.query.confirmedMatches.size() == 0 && response.query.resolvedControls.size() == 0 && response.query.merchantAliases.size() == 0 && response.query.reportAdjustments.size() == 0 && response.query.importedIntakes.size() == 0 && response.query.auditEvents.size() == 0"
    message: "Ce profil possède un historique ou une autre association et ne peut pas être supprimé. Désactivez-le plutôt."
  ) {
    profile: userProfiles(where: { id: { eq: $id } }, limit: 1) { id }
    adminProfile: userProfiles(where: { id: { eq: $id }, role: { eq: "ADMIN" } }, limit: 1) { id }
    cards: creditCards(where: { holder: { id: { eq: $id } } }, limit: 1) { id }
    cardStatements: creditCardStatements(where: { holderIdSnapshot: { eq: $id } }, limit: 1) { id }
    importedStatements: creditCardStatements(where: { importedBy: { id: { eq: $id } } }, limit: 1) { id }
    cardHolderHistory: creditCardHolderHistories(where: { holder: { id: { eq: $id } } }, limit: 1) { id }
    corrections: transactionCorrections(where: { correctedBy: { id: { eq: $id } } }, limit: 1) { id }
    invoices: invoices(where: { createdBy: { id: { eq: $id } } }, limit: 1) { id }
    confirmedMatches: reconciliationMatches(where: { confirmedBy: { id: { eq: $id } } }, limit: 1) { id }
    resolvedControls: reconciliationOutsideControls(where: { resolvedBy: { id: { eq: $id } } }, limit: 1) { id }
    merchantAliases: merchantAliases(where: { createdBy: { id: { eq: $id } } }, limit: 1) { id }
    reportAdjustments: reportAdjustmentSets(where: { holderId: { eq: $id } }, limit: 1) { id }
    importedIntakes: invoiceIntakes(where: { uploaderUid: { eq: $firebaseUid } }, limit: 1) { receiptId }
    auditEvents: auditEvents(where: { actorUid: { eq: $firebaseUid } }, limit: 1) { id }
  }
  userProfile_delete(key: { id: $id })
  auditEvent_upsert(data: {
    id: $auditEventId
    actorUid_expr: "auth.uid"
    actorRole_expr: "auth.token.role"
    action: "USER_DELETED"
    entityType: "UserProfile"
    entityId: $id
    details: $auditDetails
  })
}


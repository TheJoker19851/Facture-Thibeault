# Server-only AI persistence. The Admin SDK verifies the Firebase token,
# confirms ownership of the intake and performs deterministic classification
# before executing this operation. Browser clients cannot call it directly.
mutation UpdateInvoiceIntakeAiResult(
  $receiptId: String!
  $status: String @retired(reason: "Legacy status is retained for wire compatibility; processingStatus is the source of truth.")
  $aiModel: String!
  $aiConfidence: Float!
  $extractedVendor: String!
  $extractedInvoiceNumber: String
  $extractedInvoiceDate: Date
  $extractedSubtotalCents: Int64!
  $extractedTpsCents: Int64!
  $extractedTvqCents: Int64!
  $extractedTotalCents: Int64!
  $extractedLineItems: String!
  $extractedCurrency: String!
  $extractedSku: String
  $extractedCategory: String
  $extractedProjectNumber: String
  $classificationAccountCode: String
  $classificationCategory: String
  $classificationSource: String!
  $classificationConfidence: Float!
  $classificationStatus: String!
  $aiNotes: String!
  $processingStatus: String = "NEEDS_REVIEW"
  $decisionExceptions: String = "[]"
  $decisionChecks: String = "[]"
  $actorUid: String = ""
  $actorRole: String = ""
  $writeAudit: Boolean = false
  $auditEventId: String = ""
  $auditDetails: String = "{}"
) @auth(level: NO_ACCESS) @transaction {
  # Compare-and-set: exactly one AI attempt may claim a PROCESSING intake.
  # Retries after POSTING_ERROR first pass through RetryInvoiceIntakeAi.
  invoiceIntake_updateMany(
    where: {
      receiptId: { eq: $receiptId }
      processingStatus: { eq: "PROCESSING" }
      processingState: { eq: "RUNNING" }
      accountingStatus: { eq: "NOT_POSTED" }
    }
    data: {
      status: $processingStatus
      processingStatus: $processingStatus
      processingState: "COMPLETED"
      lastAttemptAt_expr: "request.time"
      accountingStatus: "NOT_POSTED"
      lastError: null
      aiErrorCode: null
      aiModel: $aiModel
      aiConfidence: $aiConfidence
      extractedVendor: $extractedVendor
      extractedInvoiceNumber: $extractedInvoiceNumber
      extractedInvoiceDate: $extractedInvoiceDate
      extractedSubtotalCents: $extractedSubtotalCents
      extractedTpsCents: $extractedTpsCents
      extractedTvqCents: $extractedTvqCents
      extractedTotalCents: $extractedTotalCents
      extractedLineItems: $extractedLineItems
      extractedCurrency: $extractedCurrency
      extractedSku: $extractedSku
      extractedCategory: $extractedCategory
      extractedProjectId: null
      extractedProjectNumber: $extractedProjectNumber
      classificationAccountCode: $classificationAccountCode
      classificationCategory: $classificationCategory
      classificationSource: $classificationSource
      classificationConfidence: $classificationConfidence
      classificationStatus: $classificationStatus
      aiNotes: $aiNotes
      decisionExceptions: $decisionExceptions
      decisionChecks: $decisionChecks
    }
  )
  query @redact @check(expr: "response.invoiceIntake_updateMany == 1", message: "Le résultat IA a déjà été enregistré ou l’intake n’est plus en traitement.") {
    invoiceIntakes(where: { receiptId: { eq: $receiptId } }) {
      receiptId
    }
  }
  # Retained only for old wire clients; it runs after the CAS and cannot
  # bypass the transition guard.
  invoiceIntake_update(key: { receiptId: $receiptId }, data: { lastError: null }) @retired(reason: "Use the CAS result invoiceIntake_updateMany; legacy response retained temporarily.")
  auditEvent_upsert(data: {
    id: $auditEventId
    actorUid: $actorUid
    actorRole: $actorRole
    action: "AI_EXTRACTION_COMPLETED"
    entityType: "InvoiceIntake"
    entityId: $receiptId
    details: $auditDetails
  }) @include(if: $writeAudit)
}

mutation MarkInvoiceIntakeAiError(
  $receiptId: String!
  $error: String!
  $aiErrorCode: String
  $accountingStatus: String = "NOT_POSTED"
  $decisionExceptions: String = "[]"
  $decisionChecks: String = "[]"
  $actorUid: String = ""
  $actorRole: String = ""
  $writeAudit: Boolean = false
  $auditEventId: String = ""
  $auditDetails: String = "{}"
) @auth(level: NO_ACCESS) @transaction {
  # Never downgrade a validated or posted intake. This update is deliberately
  # conditional because it also runs from the error path of a concurrent call.
  invoiceIntake_updateMany(
    where: {
      receiptId: { eq: $receiptId }
      processingStatus: { eq: "PROCESSING" }
      processingState: { eq: "RUNNING" }
      accountingStatus: { eq: "NOT_POSTED" }
    }
    data: {
      status: "NEEDS_REVIEW"
      processingStatus: "NEEDS_REVIEW"
      processingState: "FAILED"
      lastAttemptAt_expr: "request.time"
      accountingStatus: "NOT_POSTED"
      lastError: $error
      aiErrorCode: $aiErrorCode
      decisionExceptions: $decisionExceptions
      decisionChecks: $decisionChecks
      aiNotes: $error
    }
  )
  query @redact @check(expr: "response.invoiceIntake_updateMany == 1", message: "L’intake n’est plus dans un état pouvant être marqué en erreur.") {
    invoiceIntakes(where: { receiptId: { eq: $receiptId } }) {
      receiptId
    }
  }
  invoiceIntake_update(key: { receiptId: $receiptId }, data: { lastError: $error }) @retired(reason: "Use the guarded invoiceIntake_updateMany transition; legacy response retained temporarily.")
  auditEvent_upsert(data: {
    id: $auditEventId
    actorUid: $actorUid
    actorRole: $actorRole
    action: "AI_PROCESSING_FAILED"
    entityType: "InvoiceIntake"
    entityId: $receiptId
    details: $auditDetails
  }) @include(if: $writeAudit)
}

mutation MarkInvoiceIntakeAiMaxAttempts(
  $receiptId: String!
  $currentAttempts: Int!
  $decisionExceptions: String!
  $decisionChecks: String!
  $actorUid: String = ""
  $actorRole: String = ""
  $writeAudit: Boolean = false
  $auditEventId: String = ""
  $auditDetails: String = "{}"
) @auth(level: NO_ACCESS) @transaction {
  # A transient Gemini error may be reopened only before the configured limit.
  # Reaching the limit remains a human-review state and never re-enters the queue.
  invoiceIntake_updateMany(
    where: {
      receiptId: { eq: $receiptId }
      processingStatus: { eq: "NEEDS_REVIEW" }
      processingState: { eq: "FAILED" }
      processingAttempts: { eq: $currentAttempts }
      accountingStatus: { eq: "NOT_POSTED" }
      aiErrorCode: { eq: "GEMINI_TRANSIENT" }
    }
    data: {
      status: "NEEDS_REVIEW"
      processingStatus: "NEEDS_REVIEW"
      processingState: "FAILED"
      accountingStatus: "NOT_POSTED"
      aiErrorCode: "AI_MAX_ATTEMPTS_REACHED"
      decisionExceptions: $decisionExceptions
      decisionChecks: $decisionChecks
      aiNotes: "AI_MAX_ATTEMPTS_REACHED"
    }
  )
  query @redact @check(expr: "response.invoiceIntake_updateMany == 1", message: "La limite de tentatives est déjà enregistrée ou l’intake n’est plus dans l’état attendu.") {
    invoiceIntakes(where: { receiptId: { eq: $receiptId } }) { receiptId }
  }
  auditEvent_upsert(data: {
    id: $auditEventId
    actorUid: $actorUid
    actorRole: $actorRole
    action: "AI_MAX_ATTEMPTS_REACHED"
    entityType: "InvoiceIntake"
    entityId: $receiptId
    details: $auditDetails
  }) @include(if: $writeAudit)
}

mutation MarkInvoiceIntakeAutoPostingError(
  $receiptId: String!
  $error: String!
  $decisionExceptions: String = "[]"
  $decisionChecks: String = "[]"
  $actorUid: String = ""
  $actorRole: String = ""
  $writeAudit: Boolean = false
  $auditEventId: String = ""
  $auditDetails: String = "{}"
) @auth(level: NO_ACCESS) @transaction {
  # Only the server-side automatic posting path may mark an AUTO_APPROVED
  # intake as a posting error. A losing AI request cannot use this transition.
  invoiceIntake_updateMany(
    where: {
      receiptId: { eq: $receiptId }
      processingStatus: { eq: "AUTO_APPROVED" }
      accountingStatus: { eq: "NOT_POSTED" }
    }
    data: {
      status: "NEEDS_REVIEW"
      processingStatus: "NEEDS_REVIEW"
      processingState: "FAILED"
      lastAttemptAt_expr: "request.time"
      accountingStatus: "POSTING_ERROR"
      lastError: $error
      aiErrorCode: null
      decisionExceptions: $decisionExceptions
      decisionChecks: $decisionChecks
      aiNotes: $error
    }
  )
  query @redact @check(expr: "response.invoiceIntake_updateMany == 1", message: "L’intake n’est plus dans l’état AUTO_APPROVED attendu pour le posting.") {
    invoiceIntakes(where: { receiptId: { eq: $receiptId } }) {
      receiptId
    }
  }
  invoiceIntake_update(key: { receiptId: $receiptId }, data: { lastError: $error }) @retired(reason: "Use the guarded automatic-posting transition; legacy response retained temporarily.")
  auditEvent_upsert(data: {
    id: $auditEventId
    actorUid: $actorUid
    actorRole: $actorRole
    action: "AI_PROCESSING_FAILED"
    entityType: "InvoiceIntake"
    entityId: $receiptId
    details: $auditDetails
  }) @include(if: $writeAudit)
}

# Kim or an administrator can correct the AI suggestion and explicitly move
# the intake to the accounting handoff queue. This mutation still does not
# create a transaction; the card, optional statement period and duplicate checks are
# handled by the following accounting-commit step.
mutation UpdateInvoiceIntakeReview(
  $receiptId: String!
  $status: String!
  $extractedVendor: String!
  $extractedInvoiceNumber: String
  $extractedInvoiceDate: Date
  $extractedSubtotalCents: Int64!
  $extractedTpsCents: Int64!
  $extractedTvqCents: Int64!
  $extractedTotalCents: Int64!
  $extractedLineItems: String!
  $extractedCurrency: String!
  $extractedSku: String
  $extractedCategory: String
  $extractedProjectNumber: String
  $classificationAccountCode: String
  $classificationCategory: String
  $classificationSource: String!
  $classificationConfidence: Float!
  $classificationStatus: String!
  $aiNotes: String!
  $decisionExceptions: String = "[]"
  $decisionChecks: String = "[]"
  $writeAudit: Boolean = false
  $auditEventId: String = ""
  $auditDetails: String = "{}"
  $expectedReviewRevision: Int! = 0
  $nextReviewRevision: Int!
) @auth(expr: "(auth.token.role == 'KIM' || auth.token.role == 'ADMIN') && (vars.status in ['NEEDS_REVIEW', 'VALIDATED'])") @transaction {
  # KIM may resolve an exception or revise an already validated, not-yet-posted
  # intake. The processing/accounting fields remain the compare-and-set guard.
  invoiceIntake_updateMany(
    where: {
      receiptId: { eq: $receiptId }
      processingStatus: { in: ["NEEDS_REVIEW", "VALIDATED"] }
      reviewRevision: { eq: $expectedReviewRevision }
      accountingStatus: { eq: "NOT_POSTED" }
    }
    data: {
      status: $status
      processingStatus: $status
      processingState: "REVIEWED"
      reviewRevision: $nextReviewRevision
      accountingStatus: "NOT_POSTED"
      lastError: null
      aiErrorCode: null
      extractedVendor: $extractedVendor
      extractedInvoiceNumber: $extractedInvoiceNumber
      extractedInvoiceDate: $extractedInvoiceDate
      extractedSubtotalCents: $extractedSubtotalCents
      extractedTpsCents: $extractedTpsCents
      extractedTvqCents: $extractedTvqCents
      extractedTotalCents: $extractedTotalCents
      extractedLineItems: $extractedLineItems
      extractedCurrency: $extractedCurrency
      extractedSku: $extractedSku
      extractedCategory: $extractedCategory
      extractedProjectId: null
      extractedProjectNumber: $extractedProjectNumber
      classificationAccountCode: $classificationAccountCode
      classificationCategory: $classificationCategory
      classificationSource: $classificationSource
      classificationConfidence: $classificationConfidence
      classificationStatus: $classificationStatus
      aiNotes: $aiNotes
      decisionExceptions: $decisionExceptions
      decisionChecks: $decisionChecks
    }
  )
  query @redact @check(expr: "response.invoiceIntake_updateMany == 1", message: "La facture n’est plus dans un état révisable.") {
    invoiceIntakes(where: { receiptId: { eq: $receiptId } }) {
      receiptId
    }
  }
  invoiceIntake_update(key: { receiptId: $receiptId }, data: { lastError: null }) @retired(reason: "Use the guarded invoiceIntake_updateMany transition; legacy response retained temporarily.")
  auditEvent_upsert(data: {
    id: $auditEventId
    actorUid_expr: "auth.uid"
    actorRole_expr: "auth.token.role"
    action: "HUMAN_CORRECTION"
    entityType: "InvoiceIntake"
    entityId: $receiptId
    details: $auditDetails
  }) @include(if: $writeAudit)
}

# A wrong or personal invoice is removed from the operational queue without
# deleting the intake row. The audit record remains available, while the
# server route removes the associated Storage files after this guarded change.
mutation DiscardInvoiceIntake(
  $receiptId: String!
  $actorUid: String!
  $actorRole: String!
  $auditEventId: String!
  $auditDetails: String!
) @auth(level: NO_ACCESS) @transaction {
  invoiceIntake_updateMany(
    where: {
      receiptId: { eq: $receiptId }
      accountingStatus: { eq: "NOT_POSTED" }
      processingStatus: { in: ["PROCESSING", "NEEDS_REVIEW", "VALIDATED", "AUTO_APPROVED", "POSTING_ERROR"] }
    }
    data: {
      status: "DELETED"
      processingStatus: "DELETED"
      accountingStatus: "NOT_POSTED"
      lastError: "Facture retirée par un utilisateur autorisé."
      decisionExceptions: "[]"
      decisionChecks: "[]"
    }
  )
  query @redact @check(expr: "response.invoiceIntake_updateMany == 1", message: "La facture est déjà comptabilisée ou n’est plus supprimable.") {
    invoiceIntakes(where: { receiptId: { eq: $receiptId } }) {
      receiptId
      processingStatus
      accountingStatus
    }
  }
  auditEvent_upsert(data: {
    id: $auditEventId
    actorUid: $actorUid
    actorRole: $actorRole
    action: "INVOICE_DISCARDED"
    entityType: "InvoiceIntake"
    entityId: $receiptId
    details: $auditDetails
  })
}

# A posted invoice can be removed from operational views only through this
# server-controlled transition. The rows remain for audit/history, while all
# active reads exclude the DELETED processing state.
mutation DeletePostedInvoice(
  $invoiceId: String!
  $transactionId: String!
  $receiptId: String!
  $writeIntake: Boolean!
  $reason: String!
  $actorUid: String!
  $actorRole: String!
  $auditEventId: String!
  $auditDetails: String!
) @auth(level: NO_ACCESS) @transaction {
  invoice_updateMany(
    where: {
      id: { eq: $invoiceId }
      accountingStatus: { eq: "POSTED" }
      processingStatus: { in: ["VALIDATED", "AUTO_APPROVED"] }
      transaction: { id: { eq: $transactionId } }
    }
    data: {
      processingStatus: "DELETED"
      accountingStatus: "DELETED"
      reviewStatus: "DELETED"
    }
  )
  expenseTransaction_updateMany(
    where: {
      id: { eq: $transactionId }
      accountingStatus: { eq: "POSTED" }
      processingStatus: { in: ["VALIDATED", "AUTO_APPROVED"] }
    }
    data: {
      status: "DELETED"
      processingStatus: "DELETED"
      accountingStatus: "DELETED"
      issue: $reason
    }
  )
  invoiceIntake_updateMany(
    where: {
      receiptId: { eq: $receiptId }
      accountingStatus: { eq: "POSTED" }
      processingStatus: { in: ["VALIDATED", "AUTO_APPROVED"] }
    }
    data: {
      status: "DELETED"
      processingStatus: "DELETED"
      processingState: "DELETED"
      accountingStatus: "NOT_POSTED"
      lastError: $reason
    }
  ) @include(if: $writeIntake)
  query @redact @check(
    expr: "response.invoice_updateMany == 1 && response.expenseTransaction_updateMany == 1 && (!vars.writeIntake || response.invoiceIntake_updateMany == 1)"
    message: "La facture n’est plus une écriture publiée supprimable."
  ) {
    invoices(where: { id: { eq: $invoiceId } }, limit: 1) { id processingStatus accountingStatus }
    expenseTransactions(where: { id: { eq: $transactionId } }, limit: 1) { id processingStatus accountingStatus }
  }
  auditEvent_upsert(data: {
    id: $auditEventId
    actorUid: $actorUid
    actorRole: $actorRole
    action: "POSTED_INVOICE_DELETED"
    entityType: "Invoice"
    entityId: $invoiceId
    details: $auditDetails
  })
}

mutation MarkInvoiceIntakePostingError($receiptId: String!) @auth(expr: "auth.token.role == 'KIM' || auth.token.role == 'ADMIN'") {
  # Client-side KIM commits use this compensating transition only after the
  # transactional posting mutation fails. It cannot create or post anything.
  invoiceIntake_updateMany(
    where: {
      receiptId: { eq: $receiptId }
      processingStatus: { in: ["VALIDATED", "AUTO_APPROVED"] }
      accountingStatus: { eq: "NOT_POSTED" }
    }
    data: {
      status: "NEEDS_REVIEW"
      processingStatus: "NEEDS_REVIEW"
      accountingStatus: "POSTING_ERROR"
      lastError: "La création de l’écriture comptable a échoué."
      aiErrorCode: null
    }
  )
}

# A controlled retry is the only way to reopen a failed posting for the AI
# route. Its compare-and-set guarantees that two retry requests cannot both
# reopen the same intake.
mutation RetryInvoiceIntakeAi($receiptId: String!) @auth(level: NO_ACCESS) @transaction {
  invoiceIntake_updateMany(
    where: {
      receiptId: { eq: $receiptId }
      processingStatus: { eq: "NEEDS_REVIEW" }
      accountingStatus: { eq: "POSTING_ERROR" }
    }
    data: {
      status: "PROCESSING"
      processingStatus: "PROCESSING"
      processingState: "RETRY"
      accountingStatus: "NOT_POSTED"
      lastError: null
      aiErrorCode: null
    }
  )
  query @redact @check(expr: "response.invoiceIntake_updateMany == 1", message: "Aucun posting en erreur à relancer.") {
    invoiceIntakes(where: { receiptId: { eq: $receiptId } }) {
      receiptId
    }
  }
}

# Compatibility-only V1 operation retained for connector compatibility. It
# fails closed inside its transaction; only the stricter V2 retry may reopen.
mutation RetryInvoiceIntakeAiTransient($receiptId: String!) @auth(level: NO_ACCESS) @transaction {
  invoiceIntake_updateMany(
    where: {
      receiptId: { eq: $receiptId }
      processingStatus: { eq: "NEEDS_REVIEW" }
      accountingStatus: { eq: "NOT_POSTED" }
      lastError: { eq: "Le traitement IA a échoué; la facture doit être vérifiée manuellement." }
    }
    data: {
      status: "PROCESSING"
      processingStatus: "PROCESSING"
      processingState: "RETRY"
      accountingStatus: "NOT_POSTED"
      lastError: null
      decisionExceptions: "[]"
      decisionChecks: "[]"
    }
  )
  query @redact @check(expr: "false", message: "Ce retry V1 est désactivé; utilisez RetryInvoiceIntakeAiTransientV2.") {
    invoiceIntakes(where: { receiptId: { eq: $receiptId } }) { receiptId }
  }
}

# A transient Gemini capacity failure is different from a manual-review
# decision: no extraction was persisted and accounting was never attempted.
# This server-only CAS reopens only that NOT_POSTED error state. The API route
# additionally verifies the structured exception is a retryable capacity or
# availability error before invoking this operation.
mutation RetryInvoiceIntakeAiTransientV2(
  $receiptId: String!
  $invoiceId: String!
  $storageFolder: String!
) @auth(level: NO_ACCESS) @transaction {
  invoiceIntake_updateMany(
    where: {
      receiptId: { eq: $receiptId }
      processingStatus: { eq: "NEEDS_REVIEW" }
      accountingStatus: { eq: "NOT_POSTED" }
      lastError: { eq: "Le traitement IA a échoué; la facture doit être vérifiée manuellement." }
      aiErrorCode: { eq: "GEMINI_TRANSIENT" }
    }
    data: {
      status: "PROCESSING"
      processingStatus: "PROCESSING"
      processingState: "RETRY"
      accountingStatus: "NOT_POSTED"
      lastError: null
      aiErrorCode: null
      decisionExceptions: "[]"
      decisionChecks: "[]"
    }
  )
  query @redact @check(
    expr: "response.invoiceIntake_updateMany == 1 && response.query.invoicesById.size() == 0 && response.query.invoicesByStorage.size() == 0"
    message: "Aucune erreur IA temporaire sans Invoice existante à relancer."
  ) {
    invoiceIntakes(where: { receiptId: { eq: $receiptId } }) {
      receiptId
    }
    invoicesById: invoices(where: { id: { eq: $invoiceId } }, limit: 1) { id }
    invoicesByStorage: invoices(where: { storageFolder: { eq: $storageFolder } }, limit: 1) { id }
  }
}

# A privileged reviewer may reopen only a failed AI attempt that persisted no
# extraction. This is intentionally narrower than a normal manual review:
# once an AI model or business decision exists, the intake remains in review.
mutation RetryInvoiceIntakeAiReviewV2(
  $receiptId: String!
  $currentAttempts: Int!
  $maxAttempts: Int!
) @auth(level: NO_ACCESS) @transaction {
  invoiceIntake_updateMany(
    where: {
      receiptId: { eq: $receiptId }
      processingStatus: { eq: "NEEDS_REVIEW" }
      processingState: { eq: "FAILED" }
      processingAttempts: { eq: $currentAttempts }
      accountingStatus: { eq: "NOT_POSTED" }
      lastError: { eq: "Le traitement IA a échoué; la facture doit être vérifiée manuellement." }
      aiModel: { isNull: true }
    }
    data: {
      status: "PROCESSING"
      processingStatus: "PROCESSING"
      processingState: "RETRY"
      accountingStatus: "NOT_POSTED"
      lastError: null
      aiErrorCode: null
      decisionExceptions: "[]"
      decisionChecks: "[]"
    }
  )
  query @redact @check(
    expr: "response.invoiceIntake_updateMany == 1 && vars.currentAttempts < vars.maxAttempts"
    message: "Aucune erreur IA sans extraction à relancer, ou limite de tentatives atteinte."
  ) {
    invoiceIntakes(where: { receiptId: { eq: $receiptId } }) { receiptId }
  }
}

# One server-only materialization path is shared by automatic and human
# decisions. The API routes authenticate the caller and validate Storage; this
# transaction owns every final SQL invariant and is inaccessible to clients.
mutation MaterializeInvoiceIntakeV2(
  $receiptId: String!
  $transactionId: String!
  $invoiceId: String!
  $vendor: String!
  $invoiceNumber: String
  $invoiceDate: Date!
  $subtotalCents: Int64!
  $tpsCents: Int64!
  $tvqCents: Int64!
  $totalCents: Int64!
  $lineItems: String!
  $currency: String!
  $sku: String
  $category: String!
  $account: ExpenseAccount_Key
  $cardId: String!
  $statementPeriod: CardStatementPeriod_Key
  $project: Project_Key
  $projectNumber: String
  $storageFolder: String!
  $classificationNote: String!
  $expectedProcessingStatus: String!
  $classificationSource: String!
  $classificationStatus: String!
  $actorUid: String = ""
  $actorRole: String = ""
  $writeAudit: Boolean = false
  $auditEventId: String = ""
  $auditDetails: String = "{}"
  $photoCount: Int!
  $photo1Id: String!
  $photo1StoragePath: String!
  $photo1ContentType: String!
  $hasPhoto2: Boolean!
  $photo2Id: String!
  $photo2StoragePath: String!
  $photo2ContentType: String!
  $hasPhoto3: Boolean!
  $photo3Id: String!
  $photo3StoragePath: String!
  $photo3ContentType: String!
  $hasPhoto4: Boolean!
  $photo4Id: String!
  $photo4StoragePath: String!
  $photo4ContentType: String!
  $hasPhoto5: Boolean!
  $photo5Id: String!
  $photo5StoragePath: String!
  $photo5ContentType: String!
) @auth(level: NO_ACCESS) @transaction {
  invoiceIntake_updateMany(
    where: {
      receiptId: { eq: $receiptId }
      processingStatus: { eq: $expectedProcessingStatus }
      accountingStatus: { eq: "NOT_POSTED" }
    }
    data: { accountingStatus: "POSTED" }
  )
  query @redact @check(
    expr: "response.invoiceIntake_updateMany == 1 && ((vars.expectedProcessingStatus == 'AUTO_APPROVED' && vars.classificationSource == 'AUTO_DECISION' && vars.classificationStatus == 'RESOLVED') || (vars.expectedProcessingStatus == 'VALIDATED' && vars.classificationSource == 'KIM_COMMIT' && vars.classificationStatus == 'COMMITTED')) && response.query.invoiceIntakes[0].photoCount == vars.photoCount && vars.photoCount >= 1 && vars.photoCount <= 5 && vars.hasPhoto2 == (vars.photoCount >= 2) && vars.hasPhoto3 == (vars.photoCount >= 3) && vars.hasPhoto4 == (vars.photoCount >= 4) && vars.hasPhoto5 == (vars.photoCount >= 5) && vars.photo1StoragePath.startsWith(vars.storageFolder + '/') && vars.photo1ContentType in ['image/jpeg', 'image/png', 'image/webp'] && (!vars.hasPhoto2 || (vars.photo2StoragePath.startsWith(vars.storageFolder + '/') && vars.photo2ContentType in ['image/jpeg', 'image/png', 'image/webp'])) && (!vars.hasPhoto3 || (vars.photo3StoragePath.startsWith(vars.storageFolder + '/') && vars.photo3ContentType in ['image/jpeg', 'image/png', 'image/webp'])) && (!vars.hasPhoto4 || (vars.photo4StoragePath.startsWith(vars.storageFolder + '/') && vars.photo4ContentType in ['image/jpeg', 'image/png', 'image/webp'])) && (!vars.hasPhoto5 || (vars.photo5StoragePath.startsWith(vars.storageFolder + '/') && vars.photo5ContentType in ['image/jpeg', 'image/png', 'image/webp']))"
    message: "L’intake n’est pas commitable ou ses photos ne correspondent pas au dépôt Storage."
  ) {
    invoiceIntakes(where: { receiptId: { eq: $receiptId } }) {
      receiptId
      photoCount
    }
  }
  expenseTransaction_upsert(data: {
    id: $transactionId
    transactionDate: $invoiceDate
    vendor: $vendor
    card: { id: $cardId }
    statementPeriod: $statementPeriod
    project: $project
    projectNumber: $projectNumber
    expenseAccount: $account
    categoryLabel: $category
    sku: $sku
    amountBeforeTaxCents: $subtotalCents
    tpsCents: $tpsCents
    tvqCents: $tvqCents
    totalCents: $totalCents
    currency: $currency
    status: "VALIDATED"
    processingStatus: $expectedProcessingStatus
    accountingStatus: "POSTED"
    reconciliationStatus: "UNMATCHED"
    classificationSource: $classificationSource
    classificationConfidence: 1.0
    classificationNote: $classificationNote
    invoiceNumber: $invoiceNumber
    issue: null
  })
  invoice_upsert(data: {
    id: $invoiceId
    intake: { receiptId: $receiptId }
    transaction: { id: $transactionId }
    vendor: $vendor
    invoiceNumber: $invoiceNumber
    invoiceDate: $invoiceDate
    subtotalCents: $subtotalCents
    tpsCents: $tpsCents
    tvqCents: $tvqCents
    totalCents: $totalCents
    lineItems: $lineItems
    processingStatus: $expectedProcessingStatus
    accountingStatus: "POSTED"
    reviewStatus: "VALIDATED"
    storageFolder: $storageFolder
  })
  invoicePhoto1: invoicePhoto_upsert(data: {
    id: $photo1Id
    invoice: { id: $invoiceId }
    storagePath: $photo1StoragePath
    contentType: $photo1ContentType
    sequence: 1
  })
  invoicePhoto2: invoicePhoto_upsert(data: {
    id: $photo2Id
    invoice: { id: $invoiceId }
    storagePath: $photo2StoragePath
    contentType: $photo2ContentType
    sequence: 2
  }) @include(if: $hasPhoto2)
  invoicePhoto3: invoicePhoto_upsert(data: {
    id: $photo3Id
    invoice: { id: $invoiceId }
    storagePath: $photo3StoragePath
    contentType: $photo3ContentType
    sequence: 3
  }) @include(if: $hasPhoto3)
  invoicePhoto4: invoicePhoto_upsert(data: {
    id: $photo4Id
    invoice: { id: $invoiceId }
    storagePath: $photo4StoragePath
    contentType: $photo4ContentType
    sequence: 4
  }) @include(if: $hasPhoto4)
  invoicePhoto5: invoicePhoto_upsert(data: {
    id: $photo5Id
    invoice: { id: $invoiceId }
    storagePath: $photo5StoragePath
    contentType: $photo5ContentType
    sequence: 5
  }) @include(if: $hasPhoto5)
  invoiceIntake_update(
    key: { receiptId: $receiptId }
    data: {
      status: $expectedProcessingStatus
      processingStatus: $expectedProcessingStatus
      processingState: "POSTED"
      accountingStatus: "POSTED"
      lastError: null
      aiErrorCode: null
      classificationSource: $classificationSource
      classificationStatus: $classificationStatus
      classificationConfidence: 1.0
    }
  )
  auditEvent_upsert(data: {
    id: $auditEventId
    actorUid: $actorUid
    actorRole: $actorRole
    action: "TRANSACTION_CREATED"
    entityType: "InvoiceIntake"
    entityId: $receiptId
    details: $auditDetails
  }) @include(if: $writeAudit)
}

# Posted accounting rows are corrected by recording the previous value and
# applying a new complete snapshot in the same transaction. No original row
# is deleted and no posted transaction is silently overwritten.
mutation CorrectPostedInvoice(
  $correctionId: String!
  $invoiceId: String!
  $transactionId: String!
  $actorUserId: String!
  $fieldName: String!
  $previousValue: String
  $correctedValue: String!
  $note: String!
  $vendor: String!
  $invoiceNumber: String
  $invoiceDate: Date!
  $subtotalCents: Int64!
  $tpsCents: Int64!
  $tvqCents: Int64!
  $totalCents: Int64!
  $lineItems: String!
  $category: String!
  $account: ExpenseAccount_Key
  $auditEventId: String!
  $auditDetails: String!
) @auth(expr: "auth.token.role == 'KIM' || auth.token.role == 'ADMIN'") @transaction {
  query @redact @check(
    expr: "response.query.invoices.size() == 1 && response.query.invoices[0].accountingStatus == 'POSTED' && response.query.invoices[0].transaction.id == vars.transactionId && response.query.transactions.size() == 1 && response.query.transactions[0].accountingStatus == 'POSTED'"
    message: "La facture ou la transaction n’est pas comptabilisée comme attendu."
  ) {
    invoices(where: { id: { eq: $invoiceId } }, limit: 1) { id accountingStatus transaction { id } }
    transactions: expenseTransactions(where: { id: { eq: $transactionId } }, limit: 1) { id accountingStatus }
  }
  transactionCorrection_upsert(data: {
    id: $correctionId
    invoice: { id: $invoiceId }
    transaction: { id: $transactionId }
    fieldName: $fieldName
    previousValue: $previousValue
    correctedValue: $correctedValue
    correctedBy: { id: $actorUserId }
    note: $note
  })
  expenseTransaction_update(key: { id: $transactionId }, data: {
    transactionDate: $invoiceDate
    vendor: $vendor
    invoiceNumber: $invoiceNumber
    amountBeforeTaxCents: $subtotalCents
    tpsCents: $tpsCents
    tvqCents: $tvqCents
    totalCents: $totalCents
    categoryLabel: $category
    expenseAccount: $account
    issue: null
  })
  invoice_update(key: { id: $invoiceId }, data: {
    vendor: $vendor
    invoiceNumber: $invoiceNumber
    invoiceDate: $invoiceDate
    subtotalCents: $subtotalCents
    tpsCents: $tpsCents
    tvqCents: $tvqCents
    totalCents: $totalCents
    lineItems: $lineItems
  })
  auditEvent_upsert(data: {
    id: $auditEventId
    actorUid_expr: "auth.uid"
    actorRole_expr: "auth.token.role"
    action: "POSTED_INVOICE_CORRECTED"
    entityType: "Invoice"
    entityId: $invoiceId
    details: $auditDetails
  })
}


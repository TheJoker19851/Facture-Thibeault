# Administrative fixture operations. NO_ACCESS prevents browser/client SDKs
# from executing them. Only a trusted Firebase Admin SDK script can bypass the
# directive, and scripts/seed-demo.mjs additionally refuses production.

mutation AdminSeedCreditCard(
  $id: String!
  $lastFour: String!
  $holderId: String!
  $cardFunction: String
  $status: String!
  $activeFrom: Date
) @auth(level: NO_ACCESS) {
  creditCard_upsert(data: {
    id: $id
    lastFour: $lastFour
    holder: { id: $holderId }
    cardFunction: $cardFunction
    status: $status
    activeFrom: $activeFrom
  })
}

mutation AdminSeedSkuReference(
  $merchant: String!
  $sku: String!
  $productLabel: String
  $categoryLabel: String
  $accountId: String!
  $verificationStatus: String!
) @auth(level: NO_ACCESS) {
  skuReference_upsert(data: {
    merchant: $merchant
    sku: $sku
    productLabel: $productLabel
    categoryLabel: $categoryLabel
    expenseAccount: { id: $accountId }
    verificationStatus: $verificationStatus
  })
}

mutation AdminSeedExpenseTransaction(
  $id: String!
  $transactionDate: Date!
  $vendor: String!
  $cardId: String!
  $statementPeriodId: String!
  $projectId: String!
  $accountId: String!
  $categoryLabel: String
  $sku: String
  $amountBeforeTaxCents: Int64!
  $tpsCents: Int64!
  $tvqCents: Int64!
  $totalCents: Int64!
  $currency: String!
  $status: String!
  $processingStatus: String = "PROCESSING"
  $accountingStatus: String = "NOT_POSTED"
  $reconciliationStatus: String!
  $classificationSource: String
  $classificationConfidence: Float
  $classificationNote: String
  $invoiceNumber: String
  $issue: String
) @auth(level: NO_ACCESS) {
  expenseTransaction_upsert(data: {
    id: $id
    transactionDate: $transactionDate
    vendor: $vendor
    card: { id: $cardId }
    statementPeriod: { id: $statementPeriodId }
    project: { id: $projectId }
    expenseAccount: { id: $accountId }
    categoryLabel: $categoryLabel
    sku: $sku
    amountBeforeTaxCents: $amountBeforeTaxCents
    tpsCents: $tpsCents
    tvqCents: $tvqCents
    totalCents: $totalCents
    currency: $currency
    status: $status
    processingStatus: $processingStatus
    accountingStatus: $accountingStatus
    reconciliationStatus: $reconciliationStatus
    classificationSource: $classificationSource
    classificationConfidence: $classificationConfidence
    classificationNote: $classificationNote
    invoiceNumber: $invoiceNumber
    issue: $issue
  })
}

mutation AdminSeedInvoice(
  $id: String!
  $transactionId: String!
  $vendor: String!
  $invoiceNumber: String
  $invoiceDate: Date
  $subtotalCents: Int64
  $tpsCents: Int64
  $tvqCents: Int64
  $totalCents: Int64
  $processingStatus: String = "PROCESSING"
  $accountingStatus: String = "NOT_POSTED"
  $reviewStatus: String!
  $storageFolder: String
  $createdById: String!
) @auth(level: NO_ACCESS) {
  invoice_upsert(data: {
    id: $id
    transaction: { id: $transactionId }
    vendor: $vendor
    invoiceNumber: $invoiceNumber
    invoiceDate: $invoiceDate
    subtotalCents: $subtotalCents
    tpsCents: $tpsCents
    tvqCents: $tvqCents
    totalCents: $totalCents
    processingStatus: $processingStatus
    accountingStatus: $accountingStatus
    reviewStatus: $reviewStatus
    storageFolder: $storageFolder
    createdBy: { id: $createdById }
  })
}

mutation AdminSeedInvoicePhoto(
  $id: String!
  $invoiceId: String!
  $storagePath: String!
  $contentType: String!
  $sequence: Int!
) @auth(level: NO_ACCESS) {
  invoicePhoto_upsert(data: {
    id: $id
    invoice: { id: $invoiceId }
    storagePath: $storagePath
    contentType: $contentType
    sequence: $sequence
  })
}

# DEMO-only cleanup operations. This file is NO_ACCESS by design; the cleanup
# script checks exact fixture IDs before calling any of these mutations.
mutation AdminDeleteInvoicePhoto($id: String!) @auth(level: NO_ACCESS) {
  invoicePhoto_delete(key: { id: $id })
}

mutation AdminDeleteInvoice($id: String!) @auth(level: NO_ACCESS) {
  invoice_delete(key: { id: $id })
}

mutation AdminDeleteExpenseTransaction($id: String!) @auth(level: NO_ACCESS) {
  expenseTransaction_delete(key: { id: $id })
}

mutation AdminDeleteInvoiceIntake($receiptId: String!) @auth(level: NO_ACCESS) {
  invoiceIntake_delete(key: { receiptId: $receiptId })
}

mutation AdminDeleteCreditCard($id: String!) @auth(level: NO_ACCESS) {
  creditCard_delete(key: { id: $id })
}

mutation AdminDeleteSkuReference($merchant: String!, $sku: String!) @auth(level: NO_ACCESS) {
  skuReference_delete(key: { merchant: $merchant, sku: $sku })
}

mutation AdminDeleteProject($id: String!) @auth(level: NO_ACCESS) {
  project_delete(key: { id: $id })
}

mutation AdminDeleteExpenseAccount($id: String!) @auth(level: NO_ACCESS) {
  expenseAccount_delete(key: { id: $id })
}

mutation AdminDeleteCardStatementPeriod($id: String!) @auth(level: NO_ACCESS) {
  cardStatementPeriod_delete(key: { id: $id })
}

mutation AdminDeleteUserProfile($id: String!) @auth(level: NO_ACCESS) {
  userProfile_delete(key: { id: $id })
}

query AdminListInvoices @auth(level: NO_ACCESS) {
  invoices(limit: 1000) {
    id
    intake {
      receiptId
    }
    invoiceNumber
    processingStatus
    accountingStatus
    reviewStatus
    storageFolder
    transaction {
      id
      vendor
      invoiceNumber
    }
    createdBy {
      id
      firebaseUid
    }
    invoicePhotos_on_invoice {
      id
      storagePath
      contentType
      sequence
    }
  }
}

query AdminListInvoicePhotos @auth(level: NO_ACCESS) {
  invoicePhotos(limit: 1000) {
    id
    invoice {
      id
      storageFolder
    }
    storagePath
    contentType
    sequence
  }
}

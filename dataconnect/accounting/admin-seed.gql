# Administrative fixture operations. NO_ACCESS prevents browser/client SDKs
# from executing them. Only a trusted Firebase Admin SDK script can bypass the
# directive, and scripts/seed-demo.mjs additionally refuses production.

mutation AdminSeedUserProfile(
  $id: String!
  $firebaseUid: String!
  $displayName: String!
  $email: String
  $jobTitle: String
  $role: String!
  $status: String!
) @auth(level: NO_ACCESS) {
  userProfile_upsert(data: { id: $id firebaseUid: $firebaseUid displayName: $displayName email: $email jobTitle: $jobTitle role: $role status: $status })
}

mutation AdminSeedProject(
  $id: String!
  $number: String!
  $name: String!
  $status: String!
) @auth(level: NO_ACCESS) {
  project_upsert(data: { id: $id number: $number name: $name status: $status })
}

mutation AdminSeedExpenseAccount(
  $id: String!
  $number: String!

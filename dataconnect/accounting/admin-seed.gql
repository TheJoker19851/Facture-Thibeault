query AdminListInvoices($limit: Int!, $offset: Int!) @auth(level: NO_ACCESS) {
  invoices(orderBy: [{ createdAt: ASC }, { id: ASC }], limit: $limit, offset: $offset) {
    id
    intake {
      receiptId
    }
    invoiceNumber
    processingStatus
    accountingStatus
    reviewStatus
    storageFolder
    transaction {
      id
      vendor
      invoiceNumber
    }
    createdBy {
      id
      firebaseUid
    }
    invoicePhotos_on_invoice {
      id
      storagePath
      contentType
      sequence
    }
  }
}

query AdminListInvoicePhotos($limit: Int!, $offset: Int!) @auth(level: NO_ACCESS) {
  invoicePhotos(orderBy: [{ createdAt: ASC }, { id: ASC }], limit: $limit, offset: $offset) {
    id
    invoice {
      id
      storageFolder
    }
    storagePath
    contentType
    sequence
  }
}

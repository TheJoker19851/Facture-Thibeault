mutation AdminSeedInvoiceIntake(
  $receiptId: String!
  $uploaderUid: String!
  $storageFolder: String!
  $photoCount: Int!
  $status: String!
  $processingStatus: String!
  $accountingStatus: String!
  $aiModel: String
  $aiConfidence: Float
  $extractedVendor: String
  $extractedInvoiceNumber: String
  $extractedInvoiceDate: Date
  $extractedSubtotalCents: Int64
  $extractedTpsCents: Int64
  $extractedTvqCents: Int64
  $extractedTotalCents: Int64
  $extractedCurrency: String
  $extractedSku: String
  $extractedCategory: String
  $extractedProjectId: String
  $classificationAccountCode: String
  $classificationCategory: String
  $classificationSource: String
  $classificationConfidence: Float
  $classificationStatus: String
  $decisionExceptions: String
  $decisionChecks: String
  $aiNotes: String
) @auth(level: NO_ACCESS) {
  invoiceIntake_upsert(data: {
    receiptId: $receiptId uploaderUid: $uploaderUid storageFolder: $storageFolder photoCount: $photoCount
    status: $status processingStatus: $processingStatus accountingStatus: $accountingStatus
    aiModel: $aiModel aiConfidence: $aiConfidence extractedVendor: $extractedVendor
    extractedInvoiceNumber: $extractedInvoiceNumber extractedInvoiceDate: $extractedInvoiceDate
    extractedSubtotalCents: $extractedSubtotalCents extractedTpsCents: $extractedTpsCents
    extractedTvqCents: $extractedTvqCents extractedTotalCents: $extractedTotalCents
    extractedCurrency: $extractedCurrency extractedSku: $extractedSku extractedCategory: $extractedCategory
    extractedProjectId: $extractedProjectId classificationAccountCode: $classificationAccountCode
    classificationCategory: $classificationCategory classificationSource: $classificationSource
    classificationConfidence: $classificationConfidence classificationStatus: $classificationStatus
    decisionExceptions: $decisionExceptions decisionChecks: $decisionChecks aiNotes: $aiNotes
  })
}


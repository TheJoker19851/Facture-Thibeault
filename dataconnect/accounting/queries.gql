# Read-only operations for the first application integration pass.
# Only Kim and administrator accounts can read the global accounting view.
# WORKER accounts are limited to invoice-photo uploads through Storage.

query ListUserProfiles @auth(expr: "auth.token.role == 'KIM' || auth.token.role == 'ADMIN' || auth.token.role == 'SUPER_ADMIN'") {
  userProfiles(limit: 100) {
    id
    firebaseUid
    displayName
    email
    jobTitle
    role
    status
  }
}

query ListCreditCards @auth(expr: "auth.token.role == 'KIM' || auth.token.role == 'ADMIN' || auth.token.role == 'SUPER_ADMIN'") {
  creditCards {
    id
    lastFour
    holder {
      id
      displayName
      role
      status
    }
    cardFunction
    activeFrom
    inactiveFrom
    status
  }
}

query ListCardStatementPeriods @auth(expr: "auth.token.role == 'KIM' || auth.token.role == 'ADMIN' || auth.token.role == 'SUPER_ADMIN'") {
  cardStatementPeriods {
    id
    label
    startDate
    endDate
    statementLabel
    status
  }
}

query ListExpenseAccounts @auth(expr: "auth.token.role == 'KIM' || auth.token.role == 'ADMIN' || auth.token.role == 'SUPER_ADMIN'") {
  expenseAccounts {
    code
    label
    status
  }
}

query ListProjects @auth(expr: "auth.token.role == 'KIM' || auth.token.role == 'ADMIN' || auth.token.role == 'SUPER_ADMIN'") {
  projects {
    id
    name
    status
  }
}

query ListSkuReferences @auth(expr: "auth.token.role == 'KIM' || auth.token.role == 'ADMIN' || auth.token.role == 'SUPER_ADMIN'") {
  skuReferences {
    merchant
    sku
    productLabel
    categoryLabel
    expenseAccount {
      code
      label
    }
    sourceUrl
    verificationStatus
    verifiedAt
  }
}

query ListExpenseTransactions @auth(expr: "auth.token.role == 'KIM' || auth.token.role == 'ADMIN' || auth.token.role == 'SUPER_ADMIN'") {
  expenseTransactions(limit: 250) {
    id
    transactionDate
    vendor
    card {
      id
      lastFour
      holder {
        id
        displayName
      }
    }
    statementPeriod {
      id
      label
      startDate
      endDate
    }
    project {
      id
      name
    }
    expenseAccount {
      code
      label
    }
    categoryLabel
    sku
    amountBeforeTaxCents
    tpsCents
    tvqCents
    totalCents
    currency
    status
    reconciliationStatus
    classificationSource
    classificationConfidence
    classificationNote
    invoiceNumber
    issue
  }
}

query ListInvoicesToReview @auth(expr: "auth.token.role == 'KIM' || auth.token.role == 'ADMIN' || auth.token.role == 'SUPER_ADMIN'") {
  invoices(where: {reviewStatus: {eq: "TO_VERIFY"}}) {
    id
    vendor
    invoiceNumber
    invoiceDate
    subtotalCents
    tpsCents
    tvqCents
    totalCents
    reviewStatus
    storageFolder
    transaction {
      id
      vendor
      issue
    }
    invoicePhotos_on_invoice {
      id
      storagePath
      contentType
      sequence
    }
  }
}

query ListInvoiceIntakes @auth(expr: "auth.token.role == 'KIM' || auth.token.role == 'ADMIN' || auth.token.role == 'SUPER_ADMIN'") {
  invoiceIntakes(limit: 250) {
    receiptId
    uploaderUid
    storageFolder
    photoCount
    status
    lastError
    aiModel
    aiConfidence
    extractedVendor
    extractedInvoiceNumber
    extractedInvoiceDate
    extractedSubtotalCents
    extractedTpsCents
    extractedTvqCents
    extractedTotalCents
    extractedCurrency
    extractedSku
    extractedCategory
    extractedProjectId
    classificationAccountCode
    classificationCategory
    classificationSource
    classificationConfidence
    classificationStatus
    aiNotes
    createdAt
    updatedAt
  }
}

# Read-only operations for the first application integration pass.
# Only Kim and administrator accounts can read the global accounting view.
# WORKER accounts are limited to invoice-photo uploads through Storage.

query ListUserProfiles @auth(expr: "auth.token.role == 'KIM' || auth.token.role == 'ADMIN'") {
  userProfiles(limit: 100) {
    id
    firebaseUid
    displayName
    email
    jobTitle
    role
    status
  }
}

query ListCreditCards @auth(expr: "auth.token.role == 'KIM' || auth.token.role == 'ADMIN'") {
  creditCards {
    id
    lastFour
    holder {
      id
      displayName
      role
      status
    }
    cardFunction
    activeFrom
    inactiveFrom
    status
  }
}

query ListCardStatementPeriods @auth(expr: "auth.token.role == 'KIM' || auth.token.role == 'ADMIN'") {
  cardStatementPeriods {
    id
    label
    startDate
    endDate
    statementLabel
    status
  }
}

query ListExpenseAccounts @auth(expr: "auth.token.role == 'KIM' || auth.token.role == 'ADMIN'") {
  expenseAccounts {
    id
    number
    label
    type
    status
  }
}

query ListCreditCardStatements @auth(expr: "auth.token.role == 'KIM' || auth.token.role == 'ADMIN'") {
  creditCardStatements(limit: 250) {
    id
    card {
      id
      lastFour
      holder { id displayName }
    }
    holderIdSnapshot
    holderNameSnapshot
    periodStart
    periodEnd
    originalStoragePath
    originalFilename
    importedAt
    importedBy { id displayName }
    statementHash
    status
    lineCount
    totalAmountCents
    createdAt
    updatedAt
  }
}

query ListCreditCardStatementLines($statementId: String!) @auth(expr: "auth.token.role == 'KIM' || auth.token.role == 'ADMIN'") {
  creditCardStatementLines(
    where: { statement: { id: { eq: $statementId } } }
    limit: 10000
  ) {
    id
    statement { id }
    sequence
    transactionDate
    postedDate
    merchantRaw
    merchantNormalized
    amountCents
    externalReference
    status
    rawData
    createdAt
    updatedAt
  }
}

query ListProjects @auth(expr: "auth.token.role == 'KIM' || auth.token.role == 'ADMIN'") {
  projects {
    id
    number
    name
    status
  }
}

query ListSkuReferences @auth(expr: "auth.token.role == 'KIM' || auth.token.role == 'ADMIN'") {
  skuReferences {
    merchant
    sku
    productLabel
    categoryLabel
    expenseAccount {
      id
      number
      label
      type
    }
    sourceUrl
    verificationStatus
    verifiedAt
  }
}

query ListExpenseTransactions @auth(expr: "auth.token.role == 'KIM' || auth.token.role == 'ADMIN'") {
  expenseTransactions(limit: 250) {
    id
    transactionDate
    vendor
    card {
      id
      lastFour
      holder {
        id
        displayName
      }
    }
    statementPeriod {
      id
      label
      startDate
      endDate
    }
    project {
      id
      number
      name
    }
    expenseAccount {
      id
      number
      label
      type
    }
    categoryLabel
    sku
    amountBeforeTaxCents
    tpsCents
    tvqCents
    totalCents
    currency
    status
    processingStatus
    accountingStatus
    reconciliationStatus
    classificationSource
    classificationConfidence
    classificationNote
    invoiceNumber
    issue
  }
}

query ListInvoicesToReview @auth(expr: "auth.token.role == 'KIM' || auth.token.role == 'ADMIN'") {
  invoices(where: {processingStatus: {eq: "NEEDS_REVIEW"}}) {
    id
    vendor
    invoiceNumber
    invoiceDate
    subtotalCents
    tpsCents
    tvqCents
    totalCents
    processingStatus
    accountingStatus
    reviewStatus
    storageFolder
    transaction {
      id
      vendor
      issue
    }
    invoicePhotos_on_invoice {
      id
      storagePath
      contentType
      sequence
    }
  }
}

query ListInvoiceIntakes @auth(expr: "auth.token.role == 'KIM' || auth.token.role == 'ADMIN'") {
  invoiceIntakes(limit: 250) {
    receiptId
    uploaderUid
    storageFolder
    photoCount
    status
    processingStatus
    accountingStatus
    lastError
    aiErrorCode
    aiModel
    aiConfidence
    extractedVendor
    extractedInvoiceNumber
    extractedInvoiceDate
    extractedSubtotalCents
    extractedTpsCents
    extractedTvqCents
    extractedTotalCents
    extractedCurrency
    extractedSku
    extractedCategory
    extractedProjectId
    classificationAccountCode
    classificationCategory
    classificationSource
    classificationConfidence
    classificationStatus
    aiNotes
    decisionExceptions
    decisionChecks
    createdAt
    updatedAt
  }
}

query ListAuditEvents($entityType: String!, $entityId: String!) @auth(expr: "auth.token.role == 'KIM' || auth.token.role == 'ADMIN'") {
  auditEvents(
    where: {
      entityType: { eq: $entityType }
      entityId: { eq: $entityId }
    }
    limit: 100
  ) {
    id
    actorUid
    actorRole
    actor { displayName role }
    action
    entityType
    entityId
    details
    createdAt
  }
}

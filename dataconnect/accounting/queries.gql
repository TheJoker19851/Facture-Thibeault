query ListReconciliationMatches($limit: Int!, $offset: Int!) @auth(expr: "auth.token.role == 'KIM' || auth.token.role == 'ADMIN'") {
  reconciliationMatches(where: { expenseTransaction: { processingStatus: { ne: "DELETED" } } }, orderBy: [{ createdAt: ASC }, { id: ASC }], limit: $limit, offset: $offset) {
    id
    statementLine { id statement { id } sequence }
    expenseTransaction { id }
    invoice { id }
    matchScore
    matchMethod
    status
    confirmedBy { id displayName role }
    confirmedAt
    reason
    details
    createdAt
    updatedAt
  }
}


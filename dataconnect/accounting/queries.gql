query ListCreditCardStatementLines($statementId: String!, $limit: Int!, $offset: Int!) @auth(expr: "auth.token.role == 'KIM' || auth.token.role == 'ADMIN'") {
  creditCardStatementLines(
    where: { statement: { id: { eq: $statementId } } }
    orderBy: [{ sequence: ASC }, { id: ASC }]
    limit: $limit
    offset: $offset
  ) {
    id
    statement { id }
    sequence
    transactionDate
    postedDate
    merchantRaw
    merchantNormalized
    amountCents
    externalReference
    status
    rawData
    createdAt
    updatedAt
  }
}


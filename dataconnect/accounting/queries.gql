# Read-only operations for the first application integration pass.
# Only Kim and administrator accounts can read the global accounting view.
# WORKER accounts are limited to invoice-photo uploads through Storage.

query ListUserProfiles($limit: Int!, $offset: Int!) @auth(expr: "auth.token.role == 'KIM' || auth.token.role == 'ADMIN'") {
  userProfiles(orderBy: [{ displayName: ASC }, { id: ASC }], limit: $limit, offset: $offset) {
    id
    firebaseUid
    displayName
    email
    jobTitle
    role
    status
    invitationStatus
    invitationSentAt
    invitationSentBy
    lastInvitationError
    activatedAt
  }
}

query ListCreditCards @auth(expr: "auth.token.role == 'KIM' || auth.token.role == 'ADMIN'") {
  creditCards {
    id
    lastFour
    holder {
      id
      displayName
      role
      status
    }
    cardFunction
    activeFrom
    inactiveFrom
    status
  }
}


# Factures Thibeault - first relational model
#
# Monetary values are stored as CAD cents (Int64), never as floating point
# dollars. This keeps the accounting totals exact when data reaches SQL
# Connect and the reporting layer.

type UserProfile @table(name: "user_profiles", key: "id") {
  id: String!
  firebaseUid: String! @unique
  displayName: String!
  email: String
  jobTitle: String
  role: String! @default(value: "WORKER")
  status: String! @default(value: "ACTIVE")
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type Project @table(name: "projects", key: "id") {
  id: String!
  name: String!
  status: String! @default(value: "ACTIVE")
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type ExpenseAccount @table(name: "expense_accounts", key: "code") {
  code: String!
  label: String!
  status: String! @default(value: "ACTIVE")
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type TaxAccount @table(name: "tax_accounts", key: "code") {
  code: String!
  label: String!
  status: String! @default(value: "ACTIVE")
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type CreditCard @table(name: "credit_cards", key: "id") {
  id: String!
  lastFour: String!
  holder: UserProfile!
  cardFunction: String
  status: String! @default(value: "ACTIVE")
  activeFrom: Date
  inactiveFrom: Date
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type CardStatementPeriod @table(name: "card_statement_periods", key: "id") {
  id: String!
  label: String!
  startDate: Date!
  endDate: Date!
  statementLabel: String
  status: String! @default(value: "OPEN")
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type SkuReference @table(name: "sku_references", key: ["merchant", "sku"]) {
  merchant: String!
  sku: String!
  productLabel: String
  categoryLabel: String
  expenseAccount: ExpenseAccount
  sourceUrl: String
  verificationStatus: String! @default(value: "TO_CONFIRM")
  verifiedAt: Timestamp
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type ExpenseTransaction @table(name: "expense_transactions", key: "id") {
  id: String!
  transactionDate: Date!
  vendor: String!
  card: CreditCard!
  statementPeriod: CardStatementPeriod
  project: Project
  expenseAccount: ExpenseAccount
  categoryLabel: String
  sku: String
  amountBeforeTaxCents: Int64!
  tpsCents: Int64! @default(value: 0)
  tvqCents: Int64! @default(value: 0)
  totalCents: Int64!
  currency: String! @default(value: "CAD")
  # Legacy status is kept during the migration. New code must use the explicit
  # processing/accounting fields below.
  status: String! @default(value: "TO_VERIFY")
  processingStatus: String! @default(value: "PROCESSING")
  accountingStatus: String! @default(value: "NOT_POSTED")
  reconciliationStatus: String! @default(value: "UNMATCHED")
  classificationSource: String
  classificationConfidence: Float
  classificationNote: String
  invoiceNumber: String
  issue: String
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type Invoice @table(name: "invoices", key: "id") {
  id: String!
  # Nullable for existing production rows. Every new intake-driven commit sets
  # this relation, and @unique prevents one intake from owning two invoices.
  intake: InvoiceIntake @unique
  transaction: ExpenseTransaction! @unique
  vendor: String!
  invoiceNumber: String
  invoiceDate: Date
  subtotalCents: Int64
  tpsCents: Int64
  tvqCents: Int64
  totalCents: Int64
  processingStatus: String! @default(value: "PROCESSING")
  accountingStatus: String! @default(value: "NOT_POSTED")
  reviewStatus: String! @default(value: "TO_VERIFY")
  storageFolder: String
  createdBy: UserProfile
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type InvoicePhoto @table(name: "invoice_photos", key: "id") @unique(fields: ["invoice", "sequence"]) {
  id: String!
  invoice: Invoice!
  # The same immutable Storage object cannot be attached twice, even if a
  # caller supplies a different photo ID.
  storagePath: String! @unique
  contentType: String!
  sequence: Int!
  createdAt: Timestamp! @default(expr: "request.time")
}

# Intake record written immediately after a mobile upload. It is deliberately
# separate from Invoice because OCR has not yet established the vendor, date,
# amounts or card/statement match. The receiptId is also the idempotency key:
# retrying the client acknowledgement cannot create a second intake row.
type InvoiceIntake @table(name: "invoice_intakes", key: "receiptId") {
  receiptId: String!
  uploaderUid: String!
  storageFolder: String!
  photoCount: Int!
  # Legacy status is retained for a safe local migration. The processing
  # decision is now represented by processingStatus.
  status: String! @default(value: "PROCESSING")
  processingStatus: String! @default(value: "PROCESSING")
  accountingStatus: String! @default(value: "NOT_POSTED")
  lastError: String
  # Machine-readable retry eligibility. Business exceptions such as
  # UNKNOWN_PROJECT never set this field.
  aiErrorCode: String
  aiModel: String
  aiConfidence: Float
  extractedVendor: String
  extractedInvoiceNumber: String
  extractedInvoiceDate: Date
  extractedSubtotalCents: Int64
  extractedTpsCents: Int64
  extractedTvqCents: Int64
  extractedTotalCents: Int64
  extractedCurrency: String
  extractedSku: String
  extractedCategory: String
  extractedProjectId: String
  classificationAccountCode: String
  classificationCategory: String
  classificationSource: String
  classificationConfidence: Float
  classificationStatus: String
  aiNotes: String
  # JSON arrays preserve multiple structured exceptions/checks without making
  # the first V1 dependent on a second relational workflow.
  decisionExceptions: String
  decisionChecks: String
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type TransactionCorrection @table(name: "transaction_corrections", key: "id") {
  id: String!
  invoice: Invoice
  transaction: ExpenseTransaction!
  fieldName: String!
  previousValue: String
  correctedValue: String!
  correctedBy: UserProfile!
  note: String
  createdAt: Timestamp! @default(expr: "request.time")
}

type AuditEvent @table(name: "audit_events", key: "id") {
  id: String!
  actorUid: String
  actorRole: String
  actor: UserProfile
  action: String!
  entityType: String!
  entityId: String!
  details: String
  createdAt: Timestamp! @default(expr: "request.time")
}

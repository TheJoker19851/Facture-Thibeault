# Factures Thibeault - first relational model
#
# Monetary values are stored as CAD cents (Int64), never as floating point
# dollars. This keeps the accounting totals exact when data reaches SQL
# Connect and the reporting layer.

type UserProfile @table(name: "user_profiles", key: "id") {
  id: String!
  firebaseUid: String @unique
  displayName: String!
  email: String @unique
  jobTitle: String
  role: String! @default(value: "WORKER")
  status: String! @default(value: "ACTIVE")
  invitationStatus: String! @default(value: "NOT_INVITED")
  invitationSentAt: Timestamp
  invitationSentBy: String
  lastInvitationError: String
  activatedAt: Timestamp
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type Project @table(name: "projects", key: "id") {
  id: String!
  number: String! @unique
  name: String!
  status: String! @default(value: "ACTIVE")
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type ExpenseAccount @table(name: "expense_accounts", key: "id") {
  id: String!
  number: String! @unique
  label: String!
  type: String! @default(value: "EXPENSE")
  status: String! @default(value: "ACTIVE")
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type CreditCard @table(name: "credit_cards", key: "id") {
  id: String!
  lastFour: String!
  holder: UserProfile!
  cardFunction: String
  status: String! @default(value: "ACTIVE")
  activeFrom: Date
  inactiveFrom: Date
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type CardStatementPeriod @table(name: "card_statement_periods", key: "id") {
  id: String!
  label: String!
  startDate: Date!
  endDate: Date!
  statementLabel: String
  # Five bounded free-form adjustment rows used by Kim for payments/credits.
  # The application validates and serializes the rows at this V1 boundary.
  manualAdjustmentsJson: String
  status: String! @default(value: "OPEN")
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type SkuReference @table(name: "sku_references", key: ["merchant", "sku"]) {
  merchant: String!
  sku: String!
  productLabel: String
  categoryLabel: String
  expenseAccount: ExpenseAccount
  sourceUrl: String
  verificationStatus: String! @default(value: "TO_CONFIRM")
  verifiedAt: Timestamp
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type ExpenseTransaction @table(name: "expense_transactions", key: "id") {
  id: String!
  transactionDate: Date!
  vendor: String!
  card: CreditCard!
  statementPeriod: CardStatementPeriod
  project: Project
  # Project numbers are entered manually; the legacy project relation is kept
  # only for historical rows and is not used by OCR or auto-approval.
  projectNumber: String
  expenseAccount: ExpenseAccount
  categoryLabel: String
  sku: String
  amountBeforeTaxCents: Int64!
  tpsCents: Int64! @default(value: 0)
  tvqCents: Int64! @default(value: 0)
  totalCents: Int64!
  currency: String! @default(value: "CAD")
  # Legacy status is kept during the migration. New code must use the explicit
  # processing/accounting fields below.
  status: String! @default(value: "TO_VERIFY")
  processingStatus: String! @default(value: "PROCESSING")
  accountingStatus: String! @default(value: "NOT_POSTED")
  reconciliationStatus: String! @default(value: "UNMATCHED")
  classificationSource: String
  classificationConfidence: Float
  classificationNote: String
  invoiceNumber: String
  issue: String
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type Invoice @table(name: "invoices", key: "id") {
  id: String!
  # Nullable for existing production rows. Every new intake-driven commit sets
  # this relation, and @unique prevents one intake from owning two invoices.
  intake: InvoiceIntake @unique
  transaction: ExpenseTransaction! @unique
  vendor: String!
  invoiceNumber: String
  invoiceDate: Date
  subtotalCents: Int64
  tpsCents: Int64
  tvqCents: Int64
  totalCents: Int64
  # Validated structured line items serialized as JSON at the current V1
  # boundary. The application reconciles their sum before posting.
  lineItems: String
  processingStatus: String! @default(value: "PROCESSING")
  accountingStatus: String! @default(value: "NOT_POSTED")
  reviewStatus: String! @default(value: "TO_VERIFY")
  storageFolder: String
  createdBy: UserProfile
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type InvoicePhoto @table(name: "invoice_photos", key: "id") @unique(fields: ["invoice", "sequence"]) {
  id: String!
  invoice: Invoice!
  # The same immutable Storage object cannot be attached twice, even if a
  # caller supplies a different photo ID.
  storagePath: String! @unique
  contentType: String!
  sequence: Int!
  createdAt: Timestamp! @default(expr: "request.time")
}

# Intake record written immediately after a mobile upload. It is deliberately
# separate from Invoice because OCR has not yet established the vendor, date,
# amounts or card/statement match. The receiptId is also the idempotency key:
# retrying the client acknowledgement cannot create a second intake row.
type InvoiceIntake @table(name: "invoice_intakes", key: "receiptId") {
  receiptId: String!
  uploaderUid: String!
  storageFolder: String!
  photoCount: Int!
  # Legacy status is retained for a safe local migration. The processing
  # decision is now represented by processingStatus.
  status: String! @default(value: "PROCESSING")
  processingStatus: String! @default(value: "PROCESSING")
  processingState: String! @default(value: "QUEUED")
  processingAttempts: Int! @default(value: 0)
  reviewRevision: Int! @default(value: 0)
  lastAttemptAt: Timestamp
  accountingStatus: String! @default(value: "NOT_POSTED")
  lastError: String
  # Machine-readable retry eligibility for technical AI failures.
  aiErrorCode: String
  aiModel: String
  aiConfidence: Float
  extractedVendor: String
  extractedInvoiceNumber: String
  extractedInvoiceDate: Date
  extractedSubtotalCents: Int64
  extractedTpsCents: Int64
  extractedTvqCents: Int64
  extractedTotalCents: Int64
  extractedLineItems: String
  extractedCurrency: String
  extractedSku: String
  extractedCategory: String
  # Manual project number captured during review. It is not OCR data.
  extractedProjectNumber: String
  # Legacy relation key retained for historical rows; new processing clears it.
  extractedProjectId: String
  classificationAccountCode: String
  classificationCategory: String
  classificationSource: String
  classificationConfidence: Float
  classificationStatus: String
  aiNotes: String
  # JSON arrays preserve multiple structured exceptions/checks without making
  # the first V1 dependent on a second relational workflow.
  decisionExceptions: String
  decisionChecks: String
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type TransactionCorrection @table(name: "transaction_corrections", key: "id") {
  id: String!
  invoice: Invoice
  transaction: ExpenseTransaction!
  fieldName: String!
  previousValue: String
  correctedValue: String!
  correctedBy: UserProfile!
  note: String
  createdAt: Timestamp! @default(expr: "request.time")
}

type AuditEvent @table(name: "audit_events", key: "id") {
  id: String!
  actorUid: String
  actorRole: String
  actor: UserProfile
  action: String!
  entityType: String!
  entityId: String!
  details: String
  createdAt: Timestamp! @default(expr: "request.time")
}

# A statement is immutable source evidence. The period dates and holder values
# are snapshots so later card assignments cannot rewrite history.
type CreditCardStatement @table(name: "credit_card_statements", key: "id")
  @index(fields: ["cardId", "periodStart", "periodEnd"]) {
  id: String!
  card: CreditCard!
  holderIdSnapshot: String!
  holderNameSnapshot: String!
  periodStart: Date!
  periodEnd: Date!
  originalStoragePath: String!
  originalFilename: String!
  importedAt: Timestamp! @default(expr: "request.time")
  importedBy: UserProfile!
  statementHash: String! @unique
  status: String! @default(value: "IMPORTED")
  lineCount: Int! @default(value: 0)
  totalAmountCents: Int64! @default(value: 0)
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

# Server-owned manual report adjustments for custom and scoped periods.
type ReportAdjustmentSet @table(name: "report_adjustment_sets", key: "id") {
  id: String!
  periodKey: String!
  periodStart: Date!
  periodEnd: Date!
  projectId: String
  holderId: String
  rowsJson: String!
  createdByUid: String!
  updatedByUid: String!
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

# Effective-dated history prevents a future card reassignment from rewriting
# the holder snapshot of an older statement or transaction.
type CreditCardHolderHistory @table(name: "credit_card_holder_history", key: "id")
  @unique(fields: ["card", "validFrom"])
  @index(fields: ["cardId", "validFrom"])
  @index(fields: ["holderId", "validFrom"]) {
  id: String!
  card: CreditCard!
  holder: UserProfile!
  validFrom: Date!
  validTo: Date
  isCurrent: Boolean! @default(value: false)
  status: String! @default(value: "ACTIVE")
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type CreditCardStatementLine @table(name: "credit_card_statement_lines", key: "id") @unique(fields: ["statement", "sequence"]) {
  id: String!
  statement: CreditCardStatement!
  sequence: Int!
  transactionDate: Date!
  postedDate: Date
  merchantRaw: String!
  merchantNormalized: String!
  amountCents: Int64!
  externalReference: String
  status: String! @default(value: "REVIEW")
  rawData: String
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type ReconciliationMatch @table(name: "reconciliation_matches", key: "id") {
  id: String!
  statementLine: CreditCardStatementLine! @unique
  expenseTransaction: ExpenseTransaction @unique
  invoice: Invoice @unique
  matchScore: Float
  matchMethod: String!
  status: String!
  confirmedBy: UserProfile
  confirmedAt: Timestamp
  reason: String
  details: String
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type ReconciliationOutsideControl @table(name: "reconciliation_outside_controls", key: "id")
  @unique(fields: ["statement", "expenseTransaction"]) {
  id: String!
  statement: CreditCardStatement!
  expenseTransaction: ExpenseTransaction!
  status: String! @default(value: "OUTSIDE_STATEMENT")
  reason: String!
  resolvedBy: UserProfile
  resolvedAt: Timestamp
  resolutionNote: String
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type MerchantAlias @table(name: "merchant_aliases", key: "id") @unique(fields: ["merchantRawKey"]) {
  id: String!
  merchantRawKey: String!
  merchantNormalized: String!
  merchantCanonical: String
  active: Boolean! @default(value: true)
  status: String! @default(value: "ACTIVE")
  source: String! @default(value: "MANUAL")
  confidence: Float
  method: String
  createdBy: UserProfile
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}
